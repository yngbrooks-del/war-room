<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>營運戰情中心｜YNG-Veysiro</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --card: #ffffff;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --brand: #104281; --brand-ink: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --r250: #86b6ef; --r350: #5598e7; --r450: #2a78d6; --r550: #1c5cab; --r650: #104281;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-ink: #006300;
  --radius: 12px;
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --brand: #1c5cab;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --r250: #184f95; --r350: #1c5cab; --r450: #2a78d6; --r550: #5598e7; --r650: #86b6ef;
    --good-ink: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--plane); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--s1); }

/* 頂部 */
header { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); padding: 10px 16px calc(0px); padding-top: max(10px, env(safe-area-inset-top)); }
.top { display: flex; align-items: center; gap: 12px; }
.top h1 { font-size: 18px; margin: 0; letter-spacing: .5px; flex: 1; white-space: nowrap; }
.top .who { font-size: 13px; opacity: .85; white-space: nowrap; }
.iconbtn { background: rgba(255,255,255,.14); border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.iconbtn:hover { background: rgba(255,255,255,.24); }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 8px -16px 0; padding: 0 12px; }
nav::-webkit-scrollbar { display: none; }
nav button { background: none; border: 0; color: rgba(255,255,255,.75); padding: 8px 10px 10px; border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; font-size: 14px; }
nav button.on { color: #fff; border-bottom-color: #fff; font-weight: 600; }
nav .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: rgba(255,255,255,.2); font-size: 11px; line-height: 18px; text-align: center; }

main { max-width: 1280px; margin: 0 auto; padding: 16px; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.banner { background: #fff4d6; color: #5a4300; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
@media (prefers-color-scheme: dark) { .banner { background: #3a2f10; color: #f3dfa5; } }
.err { background: #fde8e8; color: #8a1f1f; }

h2 { font-size: 17px; margin: 22px 0 10px; }
h2:first-child { margin-top: 0; }
.sub { color: var(--ink2); font-size: 13px; margin: -6px 0 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* 卡片與格線 */
.grid { display: grid; gap: 12px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--card); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--ring); padding: 14px 16px; }
.tile .label { color: var(--ink2); font-size: 13px; }
.tile .value { font-size: 30px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tile.click { cursor: pointer; }
.tile.click:hover { box-shadow: 0 0 0 2px var(--s1); }

/* 狀態標籤：一定配圖示和文字，不只靠顏色 */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.st.critical { background: var(--critical); color: #fff; }
.st.serious { background: var(--serious); color: #fff; }
.st.warning { background: var(--warning); color: #0b0b0b; }
.st.good { background: var(--good); color: #fff; }
.st.neutral { background: var(--grid); color: var(--ink2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* 橫條圖（漏斗、類別） */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: center; cursor: default; }
.bar .name { font-size: 13px; color: var(--ink2); text-align: right; }
.bar .track { height: 22px; position: relative; }
.bar .fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; transition: width .3s; }
.bar .num { font-size: 13px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar:hover .fill { filter: brightness(1.08); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink2); }

/* 清單 */
.list { display: grid; gap: 8px; }
.item { background: var(--card); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; }
.item:hover { box-shadow: 0 0 0 2px var(--s1); }
.item .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item .m { color: var(--ink2); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
.money { font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); text-align: center; padding: 24px; font-size: 14px; }

/* 看板 */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--ring); padding: 10px; min-height: 120px; }
.col h3 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; color: var(--ink2); }
.col .item { margin-bottom: 8px; }

/* 表格 */
.tablewrap { overflow-x: auto; background: var(--card); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--ring); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink2); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--plane); }

/* 甘特 */
.gantt { background: var(--card); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--ring); overflow-x: auto; }
.g-inner { position: relative; min-width: 760px; }
.g-head, .g-row { display: grid; grid-template-columns: 200px 1fr; }
.g-head { border-bottom: 1px solid var(--axis); position: sticky; top: 0; background: var(--surface); }
.g-label { padding: 6px 10px; font-size: 13px; border-right: 1px solid var(--grid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-group { font-weight: 650; background: var(--surface); }
.g-lane { position: relative; height: 34px; }
.g-months { position: relative; height: 30px; }
.g-month { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); font-size: 11px; color: var(--muted); padding: 6px 4px; }
.g-bar { position: absolute; top: 8px; height: 18px; border-radius: 4px; background: var(--grid); cursor: pointer; overflow: hidden; }
.g-bar .done { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); }
.g-bar.late .done { background: var(--critical); }
.g-bar:hover { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink2); }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--critical); z-index: 2; pointer-events: none; }
.g-today span { position: absolute; top: 2px; left: 4px; font-size: 11px; color: var(--critical); white-space: nowrap; }

/* 按鈕與表單 */
.btn { background: var(--s1); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: 0 0 0 1px var(--axis); }
.btn.danger { background: transparent; color: var(--critical); box-shadow: 0 0 0 1px var(--critical); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.seg { display: inline-flex; background: var(--surface); border-radius: 8px; box-shadow: 0 0 0 1px var(--ring); padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--ring); font-weight: 600; }
.fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 15; border-radius: 999px; padding: 12px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; justify-content: flex-end; }
.modal { background: var(--plane); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); box-shadow: -4px 0 24px rgba(0,0,0,.2); }
.modal h2 { margin-top: 0; }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
.form input, .form select, .form textarea { background: var(--card); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 15px; width: 100%; }
.form textarea { min-height: 70px; resize: vertical; }
.form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .hint { font-size: 12px; color: var(--muted); }
.calc { background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 13px; box-shadow: 0 0 0 1px var(--ring); }
.calc b { font-size: 16px; }
.section { margin-top: 18px; }

#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--ring), 0 4px 14px rgba(0,0,0,.15); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: none; max-width: 260px; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--plane); padding: 8px 16px; border-radius: 8px; z-index: 70; font-size: 14px; }

@media (max-width: 640px) {
  main { padding: 12px; }
  .tile .value { font-size: 24px; }
  .bar { grid-template-columns: 70px 1fr auto; }
  .g-head, .g-row { grid-template-columns: 130px 1fr; }
  .form .pair { grid-template-columns: 1fr; }
  .top .who { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>營運戰情中心</h1>
    <span class="who" id="who"></span>
    <button class="iconbtn" id="reload" title="重新整理">↻</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"><div class="empty">載入中…</div></main>
<button class="btn fab" id="fab" style="display:none">＋ 新增</button>
<div id="tip"></div>

</body>
